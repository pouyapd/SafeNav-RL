[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "safenav-rl"
version = "0.2.0"
description = "Safety-filtered reinforcement learning for 2D robot navigation (simulation)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Pouya Bathaei Pourmand"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "gymnasium>=0.29",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ros2 = ["rclpy"]

[project.scripts]
safenav = "safenav.cli:main"

[tool.setuptools.packages.find]
include = ["safenav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
markers = ["slow: end-to-end tests that train a tiny agent (about a minute)"]
